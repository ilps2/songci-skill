<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宋瓷釉色 · 新中式女装套装配色方案</title>
<style>
  :root{
    --ink:#22201C; --ink2:#4A453D; --paper:#FBFAF6; --line:#ECE7DC;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif;
    background:var(--paper); color:var(--ink);
    padding:48px 24px 64px; line-height:1.7;
  }
  header{max-width:1080px;margin:0 auto 8px;text-align:center;}
  header h1{
    font-family:'Noto Serif CJK SC','Songti SC',serif;
    font-size:30px; font-weight:700; letter-spacing:2px; color:var(--ink);
  }
  header .sub{font-size:14px;color:var(--ink2);margin-top:10px;letter-spacing:1px;}
  header .desc{font-size:13px;color:#8a8478;margin-top:6px;}

  .legend-bar{
    max-width:1080px;margin:26px auto 18px;display:flex;justify-content:center;
    gap:26px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);
  }
  .legend-bar span{display:inline-flex;align-items:center;gap:7px;}
  .dot{width:13px;height:13px;border-radius:50%;display:inline-block;}
  .dot.main{background:#7FA8B8;}
  .dot.sub{background:#B9CFD9;}
  .dot.accent{background:#A47C48;}

  .grid{
    max-width:1080px;margin:0 auto;
    display:grid;grid-template-columns:repeat(3,1fr);gap:22px;
  }
  @media(max-width:880px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:560px){.grid{grid-template-columns:1fr;}}

  .card{
    background:#fff;border:1px solid var(--line);border-radius:16px;
    overflow:hidden;box-shadow:0 6px 22px rgba(60,60,50,.06);
    transition:transform .35s cubic-bezier(.22,.61,.36,1),box-shadow .35s;
  }
  .card:hover{transform:translateY(-5px);box-shadow:0 14px 34px rgba(60,60,50,.12);}
  .stage{padding:18px 18px 6px;}
  .svgwrap{
    border-radius:12px;padding:10px 0 4px;
    background:var(--bg);
  }
  .card .titles{padding:10px 18px 2px;}
  .card .yao{font-family:'Noto Serif CJK SC',serif;font-size:17px;font-weight:700;}
  .card .glaze{font-size:12px;color:#8a8478;margin-top:2px;letter-spacing:.5px;}

  .swatches{display:flex;padding:12px 18px 4px;gap:0;}
  .sw{flex:1;text-align:center;}
  .sw .chip{height:34px;border-radius:8px 8px 0 0;border:1px solid rgba(0,0,0,.06);}
  .sw .role{font-size:10.5px;color:#8a8478;margin-top:5px;}
  .sw .hex{font-size:11px;color:var(--ink2);font-family:'DejaVu Sans Mono',monospace;margin-top:1px;}
  .sw .src{font-size:10px;color:#a89f90;margin-top:1px;}

  .note{padding:8px 18px 18px;font-size:11.5px;color:#8a8478;line-height:1.6;
        border-top:1px dashed var(--line);margin-top:6px;}

  footer{max-width:1080px;margin:40px auto 0;text-align:center;
         font-size:12px;color:#a89f90;line-height:1.8;}
  footer b{color:var(--ink2);font-weight:600;}
</style>
</head>
<body>

<header>
  <h1>宋瓷釉色 · 新中式女装套装配色方案</h1>
  <div class="sub">同一款立领上襦 × 高腰长裙 · 六套窑口釉色搭配</div>
  <div class="desc">上为衣、下为裙，分色呈现「天青 · 宋瓷 UI 设计语言」釉色板在成衣两件套上的复用</div>
</header>

<div class="legend-bar">
  <span><i class="dot main"></i>主色 · 上襦主体</span>
  <span><i class="dot sub"></i>辅助色 · 长裙裙身</span>
  <span><i class="dot accent"></i>点缀色 · 盘扣 / 腰封 / 滚边</span>
</div>

<div class="grid" id="grid"></div>

<footer>
  设计语言来源：<b>天青 · 宋瓷 UI 设计语言</b>（宋瓷 .skill）｜ 上衣取主体釉色、裙身取同窑系浅釉、点缀取茶席木案 / 窑变 / 刻花<br>
  说明：肤色与发色为固定中性值（仅展示面料配色），不参与釉色体系；本图为平面配色示意，非版型结构图。
</footer>

<script>
const palettes = [
  {
    yao:"汝窑 · 天青", glaze:"Ru Ware · Sky-blue",
    main:"#7FA8B8", sub:"#B9CFD9", accent:"#A47C48", bg:"#F1F4F6", hair:"#2C2620",
    role:["主色 #7FA8B8","辅助色 #B9CFD9","点缀色 #A47C48"],
    src:["汝釉天青","淡天青","茶褐·茶席"],
    note:"雨过天青云破处。天青上襦配淡天青长裙，茶褐腰封盘扣点睛，最贴合宋人含蓄素雅的取向。"
  },
  {
    yao:"龙泉 · 粉青", glaze:"Longquan · Pale Celadon",
    main:"#9FC2B8", sub:"#C2D8CF", accent:"#5E7E70", bg:"#F0F5F2", hair:"#2C2620",
    role:["主色 #9FC2B8","辅助色 #C2D8CF","点缀色 #5E7E70"],
    src:["龙泉粉青","浅粉青","深青·茎叶"],
    note:"粉青上襦如春水，深青盘扣似荷叶茎脉。清润两件套，适合春夏茶席与园林穿行。"
  },
  {
    yao:"官窑 · 月白", glaze:"Guan Ware · Moon White",
    main:"#CDD8DE", sub:"#E2E9EC", accent:"#7FA8B8", bg:"#F3F6F8", hair:"#2C2620",
    role:["主色 #CDD8DE","辅助色 #E2E9EC","点缀色 #7FA8B8"],
    src:["官釉月白","浅月白","天青·冰裂边"],
    note:"月白近白微青，天青腰封呼应官窑冰裂。极简留白，最显文人清气与书卷感。"
  },
  {
    yao:"建窑 · 黑釉", glaze:"Jian Ware · Black Glaze",
    main:"#2B2722", sub:"#403A31", accent:"#C29A57", bg:"#E9E3D8", hair:"#1A1714",
    role:["主色 #2B2722","辅助色 #403A31","点缀色 #C29A57"],
    src:["建盏黑釉","深褐釉","兔毫金"],
    note:"乌金上襦配深褐长裙，兔毫金线腰封如釉面银毫。低调厚重，夜宴与秋冬最显气场。"
  },
  {
    yao:"钧窑 · 窑变", glaze:"Jun Ware · Transmutation",
    main:"#8A6F95", sub:"#A65E44", accent:"#B9CFD9", bg:"#EFEBF2", hair:"#2C2620",
    role:["主色 #8A6F95","辅助色 #A65E44","点缀色 #B9CFD9"],
    src:["钧釉紫","窑变赭红","天青·出筋"],
    note:"紫襦赭裙如窑变流淌，天青出筋腰封收束。华贵而不艳俗，入窑一色、出窑万彩。"
  },
  {
    yao:"定窑 · 象牙白", glaze:"Ding Ware · Ivory White",
    main:"#F4F0E6", sub:"#E5E0D4", accent:"#B0894F", bg:"#FBFAF6", hair:"#2C2620",
    role:["主色 #F4F0E6","辅助色 #E5E0D4","点缀色 #B0894F"],
    src:["定釉象牙白","汝釉白","刻花褐"],
    note:"象牙白温润如脂，褐金腰封似刻花暗纹。最干净的底色，宜作婚礼与节庆端庄款。"
  }
];

function svg(){
  return `
  <svg viewBox="0 0 280 480" width="100%" xmlns="http://www.w3.org/2000/svg" style="display:block;max-width:240px;margin:0 auto;">
    <!-- hair back -->
    <ellipse cx="140" cy="70" rx="27" ry="30" class="g-hair"/>
    <!-- bun -->
    <ellipse cx="140" cy="40" rx="15" ry="13" class="g-hair"/>
    <!-- face -->
    <circle cx="140" cy="74" r="20" class="g-skin"/>
    <!-- neck -->
    <path d="M129,90 L151,90 L149,106 L131,106 Z" class="g-skin"/>
    <!-- sleeves (behind top) -->
    <path d="M104,122 L78,134 L66,222 L86,224 L96,162 Z" class="g-main"/>
    <path d="M176,122 L202,134 L214,222 L194,224 L184,162 Z" class="g-main"/>
    <!-- collar -->
    <path d="M128,104 L134,88 Q140,83 146,88 L152,104 L148,110 Q140,103 132,110 Z" class="g-main g-stroke"/>
    <!-- TOP bodice (上襦) -->
    <path d="M134,107 L146,107 L176,122 L188,160 L190,222 L90,222 L92,160 L104,122 Z" class="g-main"/>
    <!-- top center seam -->
    <path d="M140,110 L140,222" fill="none" class="g-stroke" stroke-width="1.2" stroke-dasharray="4 3"/>
    <!-- frog buttons -->
    <circle cx="140" cy="128" r="3.6" class="g-accent"/>
    <circle cx="140" cy="156" r="3.6" class="g-accent"/>
    <circle cx="140" cy="184" r="3.6" class="g-accent"/>
    <!-- top hem trim -->
    <path d="M90,222 L190,222" fill="none" class="g-stroke" stroke-width="2"/>
    <!-- waistband (腰封, defines two-piece) -->
    <path d="M86,226 L194,226 L194,246 L86,246 Z" class="g-accent"/>
    <!-- SKIRT body (长裙) -->
    <path d="M90,246 L190,246 L208,440 L72,440 Z" class="g-sub"/>
    <!-- skirt center line -->
    <path d="M140,246 L140,440" fill="none" class="g-stroke" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
    <!-- skirt hem trim -->
    <path d="M72,440 L208,440" fill="none" class="g-stroke" stroke-width="3"/>
    <!-- subtle embroidery (缠枝) on skirt -->
    <path d="M152,300 Q168,338 150,378" fill="none" class="g-stroke" stroke-width="1.5" opacity="0.38"/>
    <path d="M128,322 Q114,354 130,386" fill="none" class="g-stroke" stroke-width="1.5" opacity="0.30"/>
  </svg>`;
}

const grid = document.getElementById('grid');
palettes.forEach(p=>{
  const card = document.createElement('div');
  card.className='card';
  card.style.setProperty('--bg', p.bg);
  card.style.setProperty('--main', p.main);
  card.style.setProperty('--sub', p.sub);
  card.style.setProperty('--accent', p.accent);
  card.style.setProperty('--hair', p.hair);
  card.innerHTML = `
    <div class="stage">
      <div class="svgwrap">${svg()}</div>
    </div>
    <div class="titles">
      <div class="yao">${p.yao}</div>
      <div class="glaze">${p.glaze}</div>
    </div>
    <div class="swatches">
      <div class="sw"><div class="chip" style="background:${p.main}"></div>
        <div class="role">${p.role[0]}</div><div class="src">${p.src[0]}</div></div>
      <div class="sw"><div class="chip" style="background:${p.sub}"></div>
        <div class="role">${p.role[1]}</div><div class="src">${p.src[1]}</div></div>
      <div class="sw"><div class="chip" style="background:${p.accent}"></div>
        <div class="role">${p.role[2]}</div><div class="src">${p.src[2]}</div></div>
    </div>
    <div class="note">${p.note}</div>
  `;
  grid.appendChild(card);
});
</script>

<style>
  .g-main{fill:var(--main);}
  .g-sub{fill:var(--sub);}
  .g-accent{fill:var(--accent);}
  .g-skin{fill:#E9D3C2;}
  .g-hair{fill:var(--hair);}
  .g-stroke{stroke:var(--accent);}
  .sw .chip{width:100%;}
  .swatches .sw{flex:1;}
</style>

</body>
</html>
