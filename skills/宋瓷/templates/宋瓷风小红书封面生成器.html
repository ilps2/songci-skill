<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宋瓷风 · 小红书封面生成器</title>
<style>
:root{
  --tool-bg:#EDEAE2; --tool-card:#FFFFFF; --tool-ink:#22201C; --tool-ink2:#4A453D;
  --tool-line:#D8D2C4; --tool-primary:#7FA8B8; --tool-accent:#A47C48;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:var(--tool-bg);}
body{
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  color:var(--tool-ink); font-size:14px; line-height:1.6;
  padding-bottom:120px;
}

/* ============ 控制面板 ============ */
#panel{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.92); backdrop-filter:blur(10px);
  border-bottom:1px solid var(--tool-line);
  padding:10px 16px 12px;
}
#panel .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;}
#panel .row:first-child{margin-top:0;}
#panel .lbl{font-size:12px;color:var(--tool-ink2);min-width:44px;letter-spacing:1px;}
#panel h1{font-size:15px;font-weight:700;font-family:'Songti SC',serif;letter-spacing:1px;}
#panel h1 small{font-size:11px;font-weight:400;color:#9a9387;margin-left:8px;font-family:'PingFang SC',sans-serif;}
button.pbtn{
  font-family:inherit;font-size:12.5px;cursor:pointer;padding:6px 13px;border-radius:999px;
  border:1px solid var(--tool-line);background:#fff;color:var(--tool-ink2);transition:.15s;
}
button.pbtn:hover{background:#f4f1e9;}
button.pbtn.active{background:var(--tool-primary);color:#fff;border-color:var(--tool-primary);}
#sceneRow button.pbtn{font-size:12px;padding:5px 11px;}
.theme-dot{width:14px;height:14px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:-2px;border:1px solid rgba(0,0,0,.15);}

/* ============ 画布区 ============ */
#main{display:flex;gap:20px;padding:22px 16px 0;max-width:1180px;margin:0 auto;align-items:flex-start;justify-content:center;}
.canvas-wrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px;}
#canvas{
  position:relative;width:min(88vw,400px);
  background:linear-gradient(160deg,#F4F7F8,#E7EEF1);
  border-radius:6px;overflow:hidden;
  box-shadow:0 22px 50px rgba(50,50,45,.22);
  /* 基准字号由 JS 按宽度设置，画布内一律用 em */
}
#canvas .crackle{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;}
#canvas .crackle path{stroke:var(--crackle);stroke-width:1.2;fill:none;}
#canvas .frame{position:absolute;top:12px;right:12px;bottom:12px;left:12px;border:2.5px solid var(--primary);border-radius:10px;pointer-events:none;z-index:1;}
#canvas .frame::after{content:"";position:absolute;top:4px;right:4px;bottom:4px;left:4px;border-radius:7px;border:1px solid var(--accent);}
#canvas .node{position:absolute;width:12px;height:12px;pointer-events:none;z-index:1;border:2px solid var(--primary);background:var(--surface);transform:rotate(45deg);}
#canvas .node.tl{left:6px;top:6px;} #canvas .node.tr{right:6px;top:6px;}
#canvas .node.bl{left:6px;bottom:6px;} #canvas .node.br{right:6px;bottom:6px;}

#stage{position:absolute;top:26px;right:26px;bottom:26px;left:26px;z-index:2;display:flex;flex-direction:column;}
.canvas-tip{font-size:12px;color:#9a9387;text-align:center;}

/* ============ 画布内通用元素 ============ */
.t-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex:none;}
.tag{font-size:.62em;letter-spacing:1.5px;color:var(--accent);border:1px solid var(--accent);padding:.28em .9em;border-radius:999px;flex:none;display:inline-block;line-height:1.4;}
.seal{width:2.3em;height:2.3em;border-radius:.5em;background:var(--primary);color:#fff;
  font-family:'Songti SC',serif;font-size:.95em;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:none;letter-spacing:0;}
.title{font-family:'Songti SC','Noto Serif CJK SC',serif;color:var(--ink);line-height:1.35;letter-spacing:.04em;font-weight:700;}
.caption{font-size:.66em;color:var(--ink2);line-height:1.8;letter-spacing:.04em;}
.tags{font-size:.6em;color:var(--deep);letter-spacing:.5px;}
.brand{font-size:.6em;color:var(--ink3);display:flex;align-items:center;gap:.4em;}
.dotacc{width:.9em;height:.9em;border-radius:50%;background:var(--primary);flex:none;}
.foot{display:flex;justify-content:space-between;align-items:center;flex:none;gap:10px;}
.hairline{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);border:none;flex:none;}

/* 可编辑 */
.editable{cursor:text;outline:1px dashed rgba(100,140,158,.55);outline-offset:2px;border-radius:4px;transition:outline-color .15s,background .15s;}
.editable:hover{outline-color:var(--primary);}
.editable:focus{outline:1.6px solid var(--primary);background:rgba(127,168,184,.10);}
body.exporting .editable{outline:none!important;background:transparent!important;}
.editable:empty:before{content:attr(data-ph);color:var(--ink3);pointer-events:none;}
.multi-hint{position:relative;}
.multi-hint:hover::after{content:"此区域在右侧面板编辑";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  background:rgba(34,32,28,.85);color:#fff;font-size:11px;padding:4px 10px;border-radius:8px;white-space:nowrap;z-index:9;pointer-events:none;}

/* 图片槽 */
.img-slot{position:relative;border-radius:10px;cursor:pointer;overflow:hidden;
  background-size:cover;background-position:center;border:1px dashed var(--line);flex:none;}
.img-slot .ph{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;
  color:var(--ink3);font-size:.7em;letter-spacing:2px;background:linear-gradient(150deg,var(--ph1),var(--ph2));}
.img-slot.has-img .ph{display:none;}
/* 各布局图片槽尺寸约束（html2canvas 需要确定的几何尺寸，否则渐变解析 NaN） */
.lp-photo .img-slot,.lm-img .img-slot,.lc-img .img-slot,.simg .img-slot,.lg-grid .img-slot{width:100%;height:100%;}
.lr-top .img-slot{width:6.5em;height:6.5em;border-radius:12px;flex:none;}

.img-slot .clr{position:absolute;top:6px;right:6px;width:1.5em;height:1.5em;border-radius:50%;
  background:rgba(34,32,28,.55);color:#fff;font-size:.6em;display:none;align-items:center;justify-content:center;z-index:5;}
.img-slot.has-img:hover .clr{display:flex;}
.img-slot .pos{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);font-size:.55em;color:#fff;
  background:rgba(34,32,28,.5);padding:.15em .7em;border-radius:999px;display:none;z-index:5;}
.img-slot.has-img:hover .pos{display:block;}

/* 大字模式 */
#canvas.big .title{font-weight:800;letter-spacing:.02em;}

/* ============ 各布局 ============ */

/* quote 大字语录 */
.lq-stage{display:flex;flex-direction:column;height:100%;}
.lq-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:1.1em;padding:0 .4em;}
.lq-title{font-size:2.5em;}
#canvas.big .lq-title{font-size:2.9em;}
.lq-quote-mark{font-family:'Songti SC',serif;color:var(--primary);font-size:2em;line-height:0;opacity:.8;}
.lq-sub{font-size:.78em;color:var(--ink2);letter-spacing:2px;}

/* photo 图文卡 */
.lp-stage{display:flex;flex-direction:column;height:100%;gap:.75em;}
.lp-photo{flex:1;min-height:0;border-radius:12px;}
.lp-title{font-size:1.8em;}
#canvas.big .lp-title{font-size:2.05em;}

/* magazine 杂志分栏 */
.lm-stage{display:flex;height:100%;gap:1.1em;}
.lm-img{width:46%;border-radius:12px;}
.lm-side{flex:1;display:flex;flex-direction:column;gap:.8em;min-width:0;}
.lm-vtag{writing-mode:vertical-rl;font-size:.62em;letter-spacing:6px;color:var(--accent);border-right:1px solid var(--accent);padding-right:.5em;flex:none;align-self:flex-start;}
.lm-title{font-size:1.85em;}
.lm-caption{font-size:.68em;}
.lm-page{margin-top:auto;font-family:'Songti SC',serif;font-size:.7em;color:var(--ink3);letter-spacing:3px;}

/* list 清单攻略 */
.ll-stage{display:flex;flex-direction:column;height:100%;gap:.7em;}
.ll-title{font-size:1.85em;}
#canvas.big .ll-title{font-size:2.1em;}
.ll-items{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:.55em;min-height:0;overflow:hidden;}
.ll-item{display:flex;align-items:center;gap:.7em;min-height:0;}
.ll-no{flex:none;width:1.75em;height:1.75em;border-radius:50%;background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:.78em;font-family:'Songti SC',serif;font-weight:700;
  box-shadow:0 3px 8px rgba(100,140,158,.35);}
.ll-item:nth-child(even) .ll-no{background:var(--surface);color:var(--deep);border:1px solid var(--primary);box-shadow:none;}
.ll-item .tx{font-size:.82em;color:var(--ink);letter-spacing:.03em;line-height:1.45;
  border-bottom:1px solid var(--crackle);padding-bottom:.35em;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

/* steps 步骤教程 */
.ls-stage{display:flex;flex-direction:column;height:100%;gap:.7em;}
.ls-title{font-size:1.7em;}
#canvas.big .ls-title{font-size:1.95em;}
.ls-sub{font-size:.66em;color:var(--ink2);margin-top:-.35em;}
.ls-cards{flex:1;display:flex;flex-direction:column;gap:.55em;min-height:0;}
.ls-card{flex:1;min-height:0;display:flex;gap:.7em;align-items:center;background:var(--surface);
  border-radius:10px;padding:.55em .7em;border:1px solid var(--crackle);}
.ls-no{flex:none;width:1.9em;height:1.9em;border-radius:.5em;background:var(--primary);color:#fff;font-family:'Songti SC',serif;
  font-size:.95em;font-weight:700;display:flex;align-items:center;justify-content:center;transform:rotate(-4deg);}
.ls-card .tx{flex:1;min-width:0;font-size:.72em;color:var(--ink);line-height:1.5;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
.ls-card .simg{width:3.6em;height:3.6em;flex:none;border-radius:8px;}
/* 横版时步骤横排 */
#canvas.landscape .ls-cards{flex-direction:row;}
#canvas.landscape .ls-card{flex-direction:column;justify-content:flex-start;text-align:center;padding:.6em .45em;}
#canvas.landscape .ls-card .simg{width:3em;height:3em;}
#canvas.landscape .ls-card .tx{-webkit-line-clamp:4;text-align:center;}

/* compare 对比双栏 */
.lc-stage{display:flex;flex-direction:column;height:100%;gap:.6em;}
.lc-title{font-size:1.7em;text-align:center;}
.lc-main{flex:1;display:flex;gap:.5em;min-height:0;align-items:stretch;}
.lc-col{flex:1;display:flex;flex-direction:column;gap:.5em;min-width:0;background:var(--surface);border-radius:10px;padding:.6em .55em;border:1px solid var(--crackle);}
.lc-img{height:5.2em;border-radius:8px;flex:none;}
#canvas.landscape .lc-img{height:4em;}
.lc-col h4{font-family:'Songti SC',serif;font-size:.95em;color:var(--ink);text-align:center;flex:none;}
.lc-col ul{list-style:none;display:flex;flex-direction:column;gap:.35em;min-height:0;overflow:hidden;}
.lc-col li{font-size:.6em;color:var(--ink2);line-height:1.5;display:flex;gap:.4em;align-items:baseline;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.lc-col li::before{content:"";flex:none;width:.5em;height:.5em;border-radius:50%;background:var(--primary);transform:translateY(-.1em);}
.lc-vs{flex:none;align-self:center;width:2.6em;height:2.6em;border-radius:50%;background:var(--accent);color:#fff;
  font-family:'Songti SC',serif;font-weight:700;font-size:.75em;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(164,124,72,.4);}
.lc-bottom{font-size:.62em;color:var(--ink2);text-align:center;letter-spacing:.5px;}

/* collage 拼图九宫 */
.lg-stage{display:flex;flex-direction:column;height:100%;gap:.6em;}
.lg-grid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:.45em;min-height:0;}
.lg-grid .img-slot{border-radius:6px;border-style:dashed;}
.lg-bottom{display:flex;justify-content:space-between;align-items:center;flex:none;gap:10px;}

/* score 测评评分 */
.lr-stage{display:flex;flex-direction:column;height:100%;gap:.6em;}
.lr-title{font-size:1.7em;}
.lr-top{display:flex;gap:.8em;align-items:center;flex:none;}
.lr-img{width:6.5em;height:6.5em;border-radius:12px;flex:none;}
.lr-score{display:flex;flex-direction:column;align-items:center;flex:none;}
.lr-num{font-family:'Songti SC',serif;font-size:2.9em;font-weight:800;color:var(--primary);line-height:1;}
.lr-of{font-size:.6em;color:var(--ink3);letter-spacing:2px;}
.lr-star{color:var(--accent);font-size:.75em;letter-spacing:2px;}
.lr-dims{flex:1;display:flex;flex-direction:column;justify-content:space-evenly;gap:.4em;min-height:0;}
.lr-dim{display:flex;align-items:center;gap:.5em;}
.lr-dim .dn{flex:none;width:4em;font-size:.6em;color:var(--ink2);text-align:right;}
.lr-dim .bar{flex:1;height:.62em;border-radius:999px;background:var(--ph1);overflow:hidden;}
.lr-dim .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--primary),var(--deep));}
.lr-dim:nth-child(even) .bar i{background:linear-gradient(90deg,var(--accent),var(--deep));}

/* poster 全图海报 */
.lp2-stage{display:flex;flex-direction:column;height:100%;}
.lp2-bg{position:absolute;top:26px;right:26px;bottom:26px;left:26px;border-radius:10px;z-index:-1;background-size:cover;background-position:center;}
.lp2-stage .t-head{position:relative;z-index:3;}
.lp2-mid{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding-bottom:1em;gap:.5em;}
.lp2-title{font-size:2.35em;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.45);}
#canvas.big .lp2-title{font-size:2.7em;}
.lp2-sub{font-size:.8em;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.5);letter-spacing:2px;}
.lp2-mask{position:absolute;left:26px;right:26px;bottom:26px;height:55%;border-radius:0 0 10px 10px;z-index:0;
  background:linear-gradient(180deg,transparent,rgba(20,18,12,.62));pointer-events:none;}
.lp2-stage .foot{position:relative;z-index:3;}
.lp2-stage .tag{color:#fff;border-color:rgba(255,255,255,.75);}
.lp2-stage .caption{color:rgba(255,255,255,.92);}
.lp2-stage .tags{color:#fff;}
.lp2-stage .brand{color:rgba(255,255,255,.8);}
.lp2-stage .dotacc{background:#fff;}
/* 未导入图片时 poster 的占位背景 */
.lp2-bg.empty{background:linear-gradient(160deg,var(--bg1),var(--bg2));}
.lp2-bg.empty + .lp2-mask{display:none;}

/* ============ 侧栏字段面板 ============ */
#fieldPanel{flex:none;width:300px;background:var(--tool-card);border:1px solid var(--tool-line);border-radius:14px;padding:14px;position:sticky;top:110px;}
#fieldPanel h3{font-size:13px;font-family:'Songti SC',serif;letter-spacing:1px;margin-bottom:10px;color:var(--tool-ink2);}
.f-item{margin-bottom:10px;}
.f-item label{display:block;font-size:12px;color:var(--tool-ink2);margin-bottom:3px;letter-spacing:.5px;}
.f-item input,.f-item textarea{
  width:100%;font-family:inherit;font-size:13px;padding:7px 9px;border-radius:8px;
  border:1px solid var(--tool-line);background:#FBF9F3;color:var(--tool-ink);resize:vertical;line-height:1.5;}
.f-item input:focus,.f-item textarea:focus{outline:none;border-color:var(--tool-primary);box-shadow:0 0 0 3px rgba(127,168,184,.18);}
.f-item textarea{min-height:64px;}
.f-item textarea.tall{min-height:110px;}
.f-item .hint{font-size:11px;color:#9a9387;margin-top:2px;}

/* ============ 底部操作条 ============ */
#actions{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-top:1px solid var(--tool-line);padding:12px 16px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;}
#actions .main{background:var(--tool-primary);color:#fff;border-color:var(--tool-primary);font-size:14px;padding:10px 26px;border-radius:12px;}
#actions .main:hover{background:#648C9E;}
#actions .ghost{background:#fff;color:var(--tool-ink2);}

@media (max-width:860px){
  #main{flex-direction:column;align-items:center;}
  #fieldPanel{width:min(88vw,400px);position:static;order:2;}
  .canvas-wrap{order:1;}
}
@media print{
  #panel,#fieldPanel,#actions,.canvas-tip{display:none!important;}
  body{background:#fff;padding:0;}
  #main{padding:0;display:block;}
  #canvas{width:100%;box-shadow:none;border-radius:0;}
}
</style>
</head>
<body>

<header id="panel">
  <div class="row" style="justify-content:space-between;">
    <h1>宋瓷风 · 小红书封面生成器 <small>9 布局 × 20 场景 × 6 釉色 × 4 尺寸 · 一色一窑</small></h1>
  </div>
  <div class="row"><span class="lbl">布局</span><span id="layoutRow"></span></div>
  <div class="row" id="sceneRowWrap"><span class="lbl">场景</span><span id="sceneRow"></span></div>
  <div class="row"><span class="lbl">釉色</span><span id="themeRow"></span></div>
  <div class="row"><span class="lbl">尺寸</span><span id="sizeRow"></span></div>
  <div class="row"><span class="lbl">字势</span><span id="intenseRow"></span></div>
</header>

<div id="main">
  <div class="canvas-wrap">
    <div id="canvas">
      <svg class="crackle" viewBox="0 0 330 440" preserveAspectRatio="none">
        <path d="M0,70 L70,95 L150,60 L230,100 L330,75"/>
        <path d="M0,180 L80,160 L160,200 L250,165 L330,190"/>
        <path d="M0,300 L90,275 L180,315 L260,285 L330,310"/>
        <path d="M60,0 L70,95 L55,180 L75,300 L65,440"/>
        <path d="M180,0 L160,200 L185,315 L170,440"/>
        <path d="M270,0 L250,165 L260,285 L275,440"/>
        <path d="M150,60 L160,200 M230,100 L250,165 M70,95 L80,160"/>
      </svg>
      <div class="frame"></div>
      <span class="node tl"></span><span class="node tr"></span>
      <span class="node bl"></span><span class="node br"></span>
      <div id="stage"></div>
    </div>
    <div class="canvas-tip">✎ 点击画布内文字直接编辑 · 图片槽点击导入照片（可拖动调整位置）</div>
  </div>

  <aside id="fieldPanel"><h3>文案面板</h3><div id="fields"></div></aside>
</div>

<div id="actions">
  <button class="pbtn main" id="btnExport">导出 PNG · 1080</button>
  <button class="pbtn main" id="btnExportHD">导出 PNG · 1620 超清</button>
  <button class="pbtn ghost" onclick="window.print()">打印 / PDF</button>
  <button class="pbtn ghost" id="btnShuffle">随机换文案</button>
  <button class="pbtn ghost" id="btnReset">重置</button>
</div>

<script>
/* ================= 数据 ================= */
const THEMES = {
  ru:{name:'汝窑·天青',vars:{
    '--bg1':'#F4F7F8','--bg2':'#E3EDF0','--surface':'#F7F4EC','--surface2':'#FDFCF7',
    '--ink':'#22201C','--ink2':'#4A453D','--ink3':'#9a9387',
    '--primary':'#7FA8B8','--deep':'#648C9E','--accent':'#A47C48',
    '--line':'rgba(100,140,158,.45)','--crackle':'rgba(34,32,28,.06)',
    '--ph1':'#CFDEE4','--ph2':'#AFC6D0'}},
  longquan:{name:'龙泉·粉青',vars:{
    '--bg1':'#F3F6F1','--bg2':'#E0E9DF','--surface':'#F8F6EF','--surface2':'#FDFBF5',
    '--ink':'#262820','--ink2':'#4A4F45','--ink3':'#969C8D',
    '--primary':'#9DB8A8','--deep':'#7FA08D','--accent':'#B08968',
    '--line':'rgba(127,160,141,.5)','--crackle':'rgba(38,40,32,.06)',
    '--ph1':'#D5E2D6','--ph2':'#B2CAB6'}},
  guan:{name:'官窑·月白',vars:{
    '--bg1':'#F5F6F5','--bg2':'#E6EAEB','--surface':'#FAFAF7','--surface2':'#FFFFFF',
    '--ink':'#2B2B28','--ink2':'#54524B','--ink3':'#A09C92',
    '--primary':'#A9B8B5','--deep':'#859690','--accent':'#8C8272',
    '--line':'rgba(133,150,144,.5)','--crackle':'rgba(43,43,40,.055)',

function applyTheme(){
  const t=THEMES[state.theme];
  for(const k in t.vars) el('canvas').style.setProperty(k,t.vars[k]);
}
function applySize(){
  const s=SIZES[state.size];
  el('canvas').style.aspectRatio=s.ratio;
  el('canvas').style.height='';
  el('canvas').classList.toggle('landscape',s.landscape);
  // 基准字号随宽度
  const w=el('canvas').clientWidth;
  el('canvas').style.fontSize=(w/22)+'px';
}

        '<div class="lp2-sub editable" data-f="subtitle" contenteditable="true" spellcheck="false"></div>'+
      '</div>'+
      '<div class="foot">'+
        '<span class="caption editable" data-f="caption" contenteditable="true" spellcheck="false"></span>'+
        '<span class="tags editable" data-f="tags" contenteditable="true" spellcheck="false"></span>'+
      '</div>'+
    '</div>';
  }
};

function lines(s){ if(Array.isArray(s)) return s.map(String).filter(Boolean); return (s||'').toString().split('\n').map(x=>x.trim()).filter(Boolean); }

function fillMulti(){
  // list 条目
  document.querySelectorAll('[data-multi="items"]').forEach(box=>{
    const arr=lines(state.fields.items); box.innerHTML='';
    arr.forEach((t,i)=>{
      const d=document.createElement('div'); d.className='ll-item';
      d.innerHTML='<span class="ll-no">'+(i+1)+'</span><span class="tx"></span>';
      d.querySelector('.tx').textContent=t; box.appendChild(d);
    });
  });
  // steps
  document.querySelectorAll('[data-multi="steps"]').forEach(box=>{
    const arr=lines(state.fields.steps); box.innerHTML='';
    arr.forEach((t,i)=>{
      const d=document.createElement('div'); d.className='ls-card';
      d.innerHTML='<span class="ls-no">'+(i+1)+'</span><span class="tx"></span><span class="simg">'+imgSlot('s'+i,'图')+'</span>';
      d.querySelector('.tx').textContent=t; box.appendChild(d);
    });
  });
  // compare 要点
  ['left','right'].forEach(side=>{
    document.querySelectorAll('[data-multi="'+side+'Items"]').forEach(box=>{
      const arr=lines(state.fields[side+'Items']); box.innerHTML='';
      arr.forEach(t=>{ const li=document.createElement('li'); li.textContent=t; box.appendChild(li); });
    });
  });
  // score 维度条
  document.querySelectorAll('[data-multi="dims"]').forEach(box=>{
    const arr=lines(state.fields.dims); box.innerHTML='';
    arr.forEach(row=>{
      const [name,val]=row.split(/[|｜]/).map(x=>(x||'').trim());
      const v=Math.max(0,Math.min(10,parseFloat(val)||0));
      const d=document.createElement('div'); d.className='lr-dim';
      d.innerHTML='<span class="dn"></span><span class="bar"><i></i></span><span class="dn" style="text-align:left;width:2.6em;"></span>';
      d.querySelectorAll('.dn')[0].textContent=name||'';
      d.querySelector('i').style.width=(v*10)+'%';
      d.querySelectorAll('.dn')[1].textContent=(val||'');
      box.appendChild(d);
    });
  });
}

function render(){
  applyTheme(); applySize();
  el('canvas').classList.toggle('big',state.intense==='big');
  el('stage').innerHTML=RENDERS[state.layout]();
  // 写入单值字段
  document.querySelectorAll('#stage .editable').forEach(n=>{
    const k=n.dataset.f; const v=state.fields[k]||'';
    if(k==='title'||k==='caption'||k==='subtitle'||k==='tags') n.innerHTML=v.replace(/\n/g,'<br>');
    else n.textContent=v;
  });
  fillMulti();
  bindEditable(); bindImgSlots(); buildFieldPanel(); syncButtons();
  applyStoredImages();
}

/* ================= 画布内编辑 ================= */
function bindEditable(){
  document.querySelectorAll('#stage .editable').forEach(n=>{
    n.oninput=()=>{
      const k=n.dataset.f;
      const v=k==='title'||k==='caption'||k==='subtitle'||k==='tags' ? n.innerHTML.replace(/<br\s*\/?>/gi,'\n') : n.textContent;
      state.fields[k]=v;
      syncFieldInput(k,v);
    };
  });
}

/* ================= 图片槽 ================= */
let fileInput=null;
function bindImgSlots(){
  document.querySelectorAll('#stage .img-slot, #stage .lp2-bg').forEach(slot=>{
    slot.onclick=e=>{
      if(e.target.classList.contains('clr')){ delete state.images[slot.dataset.img]; applyStoredImages(); return; }
      if(!fileInput){
        fileInput=document.createElement('input'); fileInput.type='file'; fileInput.accept='image/*';
        fileInput.onchange=()=>{
          const f=fileInput.files[0]; if(!f) return;
          const r=new FileReader();
          r.onload=()=>{ state.images[fileInput._key]=r.result; fileInput._key=null; applyStoredImages(); };
          r.readAsDataURL(f);
        };
        document.body.appendChild(fileInput);
      }
      fileInput._key=slot.dataset.img;
      fileInput.value=''; fileInput.click();
    };
    // 拖动调整背景位置
    slot.addEventListener('pointerdown',e=>{
      if(!state.images[slot.dataset.img]) return;
      if(e.target.classList.contains('clr')) return;
      slot.setPointerCapture(e.pointerId);
      const rect=slot.getBoundingClientRect();
      let px=(e.clientX-rect.left)/rect.width*100, py=(e.clientY-rect.top)/rect.height*100;
      slot.style.backgroundPosition=px+'% '+py+'%';
      const move=ev=>{
        px=(ev.clientX-rect.left)/rect.width*100; py=(ev.clientY-rect.top)/rect.height*100;
        px=Math.max(0,Math.min(100,px)); py=Math.max(0,Math.min(100,py));
        slot.style.backgroundPosition=px+'% '+py+'%';
      };
      const up=()=>{ slot.removeEventListener('pointermove',move); slot.removeEventListener('pointerup',up); };
      slot.addEventListener('pointermove',move); slot.addEventListener('pointerup',up);
    });
  });
}
function applyStoredImages(){
  document.querySelectorAll('#stage .img-slot, #stage .lp2-bg').forEach(slot=>{
    const k=slot.dataset.img, img=state.images[k];
    if(img){
      slot.style.backgroundImage='url('+img+')';
      slot.classList.add('has-img');
      if(slot.classList.contains('lp2-bg')) slot.classList.remove('empty');
    }else{
      slot.style.backgroundImage='';
      slot.classList.remove('has-img');
      if(slot.classList.contains('lp2-bg')) slot.classList.add('empty');
    }
  });
}

/* ================= 侧栏 ================= */
function buildFieldPanel(){
  const box=el('fields'); box.innerHTML='';
  const cfg=LAYOUTS[state.layout];
  cfg.fields.forEach(f=>{
    const item=document.createElement('div'); item.className='f-item';
    const label=document.createElement('label'); label.textContent=f.label;
    const input=document.createElement(f.area?'textarea':'input');
    if(f.area) input.rows=2;
    if(f.tall) input.classList.add('tall');
    if(f.short){ input.style.maxWidth='120px'; }
    input.dataset.k=f.k;
    input.value=state.fields[f.k]||'';
    item.appendChild(label); item.appendChild(input);
    if(f.k==='items'){ const h=document.createElement('div'); h.className='hint'; h.textContent='每条一行，自动编号'; item.appendChild(h); }
    if(f.k==='steps'){ const h=document.createElement('div'); h.className='hint'; h.textContent='每条一步，自动编号'; item.appendChild(h); }
    if(f.k==='dims'){ const h=document.createElement('div'); h.className='hint'; h.textContent='格式：维度名|分数（0-10），如 釉色|9.5'; item.appendChild(h); }
    if(f.k==='leftItems'||f.k==='rightItems'){ const h=document.createElement('div'); h.className='hint'; h.textContent='每条一个要点'; item.appendChild(h); }
    input.oninput=()=>{
      state.fields[f.k]=input.value;
      applySingleField(f.k);
      if(['items','steps','leftItems','rightItems','dims'].includes(f.k)) fillMulti();
    };
    box.appendChild(item);
  });
  // 图片提示
  const tip=document.createElement('div'); tip.className='hint';
  tip.innerHTML='<b>图片</b>：画布内图片槽点击导入本地照片；九宫格每格可单独导入。';
  box.appendChild(tip);
}
function applySingleField(k){
  document.querySelectorAll('#stage .editable[data-f="'+k+'"]').forEach(n=>{
    if(k==='title'||k==='caption'||k==='subtitle'||k==='tags') n.innerHTML=(state.fields[k]||'').replace(/\n/g,'<br>');
    else n.textContent=state.fields[k]||'';
  });
}
function syncFieldInput(k,v){
  const inp=document.querySelector('#fields [data-k="'+k+'"]');
  if(inp && document.activeElement!==inp) inp.value=v;
}

/* ================= 控制按钮 ================= */
function makeBtns(containerId,items,activeKey,onPick,labelFn){
  const c=el(containerId); c.innerHTML='';
  items.forEach(it=>{
    const b=document.createElement('button'); b.className='pbtn';
    b.innerHTML=labelFn?labelFn(it):it.name;
    b.classList.toggle('active',it.key===activeKey);
    b.onclick=()=>onPick(it.key);
    c.appendChild(b);
  });
}
function syncButtons(){
  makeBtns('layoutRow',Object.entries(LAYOUTS).map(([k,v])=>({key:k,name:v.name})),state.layout,k=>setLayout(k));
  makeBtns('sceneRow',Object.entries(SCENES).filter(([k,v])=>v.layout===state.layout).map(([k,v])=>({key:k,name:v.name})),state.scene,k=>setScene(k));
  makeBtns('themeRow',Object.entries(THEMES).map(([k,v])=>({key:k,name:'<span class="theme-dot" style="background:'+v.vars['--primary']+'"></span>'+v.name})),state.theme,k=>{state.theme=k;applyTheme();syncButtons();},x=>x);
  makeBtns('sizeRow',Object.entries(SIZES).map(([k,v])=>({key:k,name:v.name})),state.size,k=>{state.size=k;applySize();syncButtons();});
  makeBtns('intenseRow',[{key:'big',name:'大字抓眼球'},{key:'calm',name:'克制留白'}],state.intense,k=>{state.intense=k;render();});
}

function setLayout(k){
  state.layout=k;
  const scenes=Object.entries(SCENES).filter(([kk,v])=>v.layout===k);
  if(!scenes.some(([kk])=>kk===state.scene)){ setScene(scenes[0][0]); return; }
  render();
}
function setScene(k){
  const s=SCENES[k];
  state.scene=k; state.layout=s.layout;
  state.fields=cloneScene(s);
  render();
}
function setSceneOnly(k){
  const s=SCENES[k];
  state.scene=k; state.fields=cloneScene(s);
  render();
}

/* ================= 随机换文案 ================= */
function shuffle(){
  const scenes=Object.entries(SCENES).filter(([k,v])=>v.layout===state.layout && k!==state.scene);
  const pick=scenes[Math.floor(Math.random()*scenes.length)];
  if(!pick) return;
  const s=cloneScene(pick[1]);
  // 随机替换话题标签与印章，制造新意
  s.tags=[RAND_TAGS[Math.floor(Math.random()*RAND_TAGS.length)],RAND_TAGS[Math.floor(Math.random()*RAND_TAGS.length)]].join(' ');
  state.scene=pick[0]; state.fields=s;
  render();
}

/* ================= 导出 ================= */
/* html2canvas 1.4.1 对克隆文档中的 CSS 变量解析有 bug（var() 渐变 → NaN）。
   导出前把渐变背景烘焙为浏览器解析后的具体值，导出后还原。 */
function bakeGradients(){
  const saved=[];
  el('canvas').querySelectorAll('*').forEach(n=>{
    const cs=getComputedStyle(n);
    if(cs.backgroundImage && cs.backgroundImage.includes('gradient')){
      saved.push([n,n.style.backgroundImage]);
      n.style.backgroundImage=cs.backgroundImage;
    }
  });
  return ()=>saved.forEach(([n,v])=>n.style.backgroundImage=v);
}
async function exportPNG(targetWidth){
  const btn=document.activeElement;
  if(btn){btn.disabled=true;}
  document.body.classList.add('exporting');
  const restore=bakeGradients();
  try{
    const c=el('canvas');
    const scale=targetWidth/c.clientWidth;
    const out=await html2canvas(c,{scale,backgroundColor:null,useCORS:true,logging:false});
    restore();
    document.body.classList.remove('exporting');
    const a=document.createElement('a');
    const sceneName=(SCENES[state.scene]||{}).name||'';
    a.download='宋瓷封面_'+sceneName+'_'+THEMES[state.theme].name.replace(/·/g,'')+'_'+SIZES[state.size].name.split(' ')[0]+'.png';
    a.href=out.toDataURL('image/png');
    a.click();
  }catch(e){
    restore();
    document.body.classList.remove('exporting');
    alert('导出失败：'+e);
  }
  if(btn){btn.disabled=false;}
}
el('btnExport').onclick=()=>exportPNG(1080);
el('btnExportHD').onclick=()=>exportPNG(1620);
el('btnShuffle').onclick=shuffle;
el('btnReset').onclick=()=>setScene(state.scene);

/* ================= hash 路由 ================= */
function applyHash(){
  const h={}; location.hash.replace(/^#/,'').split('&').forEach(p=>{const [k,v]=p.split('='); if(k) h[k]=v;});
  if(LAYOUTS[h.layout]) state.layout=h.layout;
  if(SCENES[h.scene]) state.scene=h.scene;
  if(THEMES[h.theme]) state.theme=h.theme;
  if(SIZES[h.size]) state.size=h.size;
  if(h.intense==='calm'||h.intense==='big') state.intense=h.intense;
  if(SCENES[state.scene].layout!==state.layout){
    const first=Object.entries(SCENES).find(([k,v])=>v.layout===state.layout);
    if(first) state.scene=first[0];
  }
  state.fields=cloneScene(SCENES[state.scene]);
}
applyHash();
window.addEventListener('resize',()=>{ applySize(); });

render();
</script>
